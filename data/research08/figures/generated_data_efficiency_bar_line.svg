<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <rect width="1100" height="760" fill="#ffffff"/>
  <style>
    .title { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #111; }
    .axis { stroke: #333; stroke-width: 1.5; }
    .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 5 5; }
    .tick { font-family: Arial, sans-serif; font-size: 17px; fill: #222; }
    .label { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #111; }
    .method { font-family: Arial, "Malgun Gothic", sans-serif; font-size: 20px; fill: #111; }
    .barLabel { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #111; }
    .lineValueBlue { font-family: Arial, sans-serif; font-size: 18px; fill: #0b62bd; font-weight: 700; }
    .lineValueOrange { font-family: Arial, sans-serif; font-size: 18px; fill: #ff6b00; font-weight: 700; }
    .note { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; font-size: 20px; fill: #111; }
  </style>

  <text x="550" y="55" text-anchor="middle" class="title">Generated Data Efficiency Comparison</text>

  <!-- Plot area: x 90~995, y 95~620 -->
  <line x1="90" y1="620" x2="995" y2="620" class="axis"/>
  <line x1="90" y1="620" x2="90" y2="95" class="axis" stroke="#0b62bd"/>
  <line x1="995" y1="620" x2="995" y2="95" class="axis"/>

  <!-- Left axis: generated count, 0~1200 -->
  <line x1="90" y1="532.5" x2="995" y2="532.5" class="grid"/>
  <line x1="90" y1="445" x2="995" y2="445" class="grid"/>
  <line x1="90" y1="357.5" x2="995" y2="357.5" class="grid"/>
  <line x1="90" y1="270" x2="995" y2="270" class="grid"/>
  <line x1="90" y1="182.5" x2="995" y2="182.5" class="grid"/>
  <line x1="90" y1="95" x2="995" y2="95" class="grid"/>
  <text x="70" y="626" text-anchor="end" class="tick" fill="#0b62bd">0</text>
  <text x="70" y="538.5" text-anchor="end" class="tick" fill="#0b62bd">200</text>
  <text x="70" y="451" text-anchor="end" class="tick" fill="#0b62bd">400</text>
  <text x="70" y="363.5" text-anchor="end" class="tick" fill="#0b62bd">600</text>
  <text x="70" y="276" text-anchor="end" class="tick" fill="#0b62bd">800</text>
  <text x="70" y="188.5" text-anchor="end" class="tick" fill="#0b62bd">1000</text>
  <text x="70" y="101" text-anchor="end" class="tick" fill="#0b62bd">1200</text>

  <!-- Right axis: performance, 0.700~0.925 -->
  <text x="1010" y="626" class="tick">0.700</text>
  <text x="1010" y="567.7" class="tick">0.725</text>
  <text x="1010" y="509.3" class="tick">0.750</text>
  <text x="1010" y="451.0" class="tick">0.775</text>
  <text x="1010" y="392.7" class="tick">0.800</text>
  <text x="1010" y="334.3" class="tick">0.825</text>
  <text x="1010" y="276.0" class="tick">0.850</text>
  <text x="1010" y="217.7" class="tick">0.875</text>
  <text x="1010" y="159.3" class="tick">0.900</text>
  <text x="1010" y="101.0" class="tick">0.925</text>

  <text x="28" y="358" text-anchor="middle" transform="rotate(-90 28 358)" class="label" fill="#0b62bd">Generated Data Count</text>
  <text x="1070" y="358" text-anchor="middle" transform="rotate(90 1070 358)" class="label">Performance Score</text>

  <defs>
    <linearGradient id="barBlue" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f6ed5"/>
      <stop offset="100%" stop-color="#0756ad"/>
    </linearGradient>
  </defs>

  <!-- Bars: generated count, max 1200 -->
  <rect x="227.5" y="182.5" width="115" height="437.5" fill="url(#barBlue)"/>
  <rect x="757.5" y="291.875" width="115" height="328.125" fill="url(#barBlue)"/>
  <text x="285" y="160" text-anchor="middle" class="barLabel">1,000</text>
  <text x="815" y="269" text-anchor="middle" class="barLabel">750</text>

  <!-- Lines: right axis y = 620 - (value - 0.700) / 0.225 * 525 -->
  <!-- Recall: 0.814, 0.818 -->
  <line x1="285" y1="354.0" x2="815" y2="344.7" stroke="#0b62bd" stroke-width="2"/>
  <circle cx="285" cy="354.0" r="7" fill="#0b62bd" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="815" cy="344.7" r="7" fill="#0b62bd" stroke="#ffffff" stroke-width="1.5"/>
  <text x="285" y="381" text-anchor="middle" class="lineValueBlue">0.814</text>
  <text x="815" y="372" text-anchor="middle" class="lineValueBlue">0.818</text>

  <!-- F1-score: 0.883, 0.880 -->
  <line x1="285" y1="193.0" x2="815" y2="200.0" stroke="#ff6b00" stroke-width="2"/>
  <rect x="277" y="185.0" width="16" height="16" fill="#ff6b00" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="807" y="192.0" width="16" height="16" fill="#ff6b00" stroke="#ffffff" stroke-width="1.5"/>
  <text x="285" y="220" text-anchor="middle" class="lineValueOrange">0.883</text>
  <text x="846" y="196" text-anchor="start" class="lineValueOrange">0.880</text>

  <!-- Legend -->
  <rect x="785" y="94" width="165" height="80" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
  <line x1="810" y1="122" x2="852" y2="122" stroke="#0b62bd" stroke-width="2"/>
  <circle cx="831" cy="122" r="6" fill="#0b62bd"/>
  <text x="865" y="128" class="method">Recall</text>
  <line x1="810" y1="151" x2="852" y2="151" stroke="#ff6b00" stroke-width="2"/>
  <rect x="824" y="145" width="12" height="12" fill="#ff6b00"/>
  <text x="865" y="157" class="method">F1-score</text>

  <text x="285" y="655" text-anchor="middle" class="method">Magnitude warping</text>
  <text x="815" y="655" text-anchor="middle" class="method">Filtered MD</text>
  <text x="550" y="704" text-anchor="middle" class="label">Method</text>

</svg>
