<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <rect width="1100" height="760" fill="#ffffff"/>
  <style>
    .title { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #111; }
    .axis { stroke: #333; stroke-width: 1.5; }
    .grid { stroke: #d7d7d7; stroke-width: 1; stroke-dasharray: 5 5; }
    .tick { font-family: Arial, sans-serif; font-size: 17px; fill: #222; }
    .label { font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #111; }
    .method { font-family: Arial, "Malgun Gothic", sans-serif; font-size: 20px; fill: #111; }
    .barLabel { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #111; }
    .lineValue { font-family: Arial, sans-serif; font-size: 18px; fill: #ff6b00; font-weight: 700; }
  </style>

  <text x="550" y="55" text-anchor="middle" class="title">False Negative Reduction Comparison</text>

  <!-- Plot area: x 100~995, y 95~620 -->
  <line x1="100" y1="620" x2="995" y2="620" class="axis"/>
  <line x1="100" y1="620" x2="100" y2="95" class="axis" stroke="#0b62bd"/>
  <line x1="995" y1="620" x2="995" y2="95" class="axis"/>

  <!-- Left axis: false negative, 0~60 -->
  <line x1="100" y1="532.5" x2="995" y2="532.5" class="grid"/>
  <line x1="100" y1="445" x2="995" y2="445" class="grid"/>
  <line x1="100" y1="357.5" x2="995" y2="357.5" class="grid"/>
  <line x1="100" y1="270" x2="995" y2="270" class="grid"/>
  <line x1="100" y1="182.5" x2="995" y2="182.5" class="grid"/>
  <line x1="100" y1="95" x2="995" y2="95" class="grid"/>
  <text x="82" y="626" text-anchor="end" class="tick" fill="#0b62bd">0</text>
  <text x="82" y="538.5" text-anchor="end" class="tick" fill="#0b62bd">10</text>
  <text x="82" y="451" text-anchor="end" class="tick" fill="#0b62bd">20</text>
  <text x="82" y="363.5" text-anchor="end" class="tick" fill="#0b62bd">30</text>
  <text x="82" y="276" text-anchor="end" class="tick" fill="#0b62bd">40</text>
  <text x="82" y="188.5" text-anchor="end" class="tick" fill="#0b62bd">50</text>
  <text x="82" y="101" text-anchor="end" class="tick" fill="#0b62bd">60</text>

  <!-- Right axis: recall, 0.790~0.830 -->
  <text x="1010" y="626" class="tick">0.790</text>
  <text x="1010" y="560.4" class="tick">0.795</text>
  <text x="1010" y="494.8" class="tick">0.800</text>
  <text x="1010" y="429.1" class="tick">0.805</text>
  <text x="1010" y="363.5" class="tick">0.810</text>
  <text x="1010" y="297.9" class="tick">0.815</text>
  <text x="1010" y="232.3" class="tick">0.820</text>
  <text x="1010" y="166.6" class="tick">0.825</text>
  <text x="1010" y="101.0" class="tick">0.830</text>

  <text x="36" y="358" text-anchor="middle" transform="rotate(-90 36 358)" class="label" fill="#0b62bd">False Negative Count</text>
  <text x="1070" y="358" text-anchor="middle" transform="rotate(90 1070 358)" class="label">Recall</text>

  <defs>
    <linearGradient id="barBlue" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f6ed5"/>
      <stop offset="100%" stop-color="#0756ad"/>
    </linearGradient>
  </defs>

  <!-- Bars: FN max 60, y = 620 - FN/60*525 -->
  <rect x="257.5" y="138.75" width="115" height="481.25" fill="url(#barBlue)"/>
  <rect x="747.5" y="147.5" width="115" height="472.5" fill="url(#barBlue)"/>
  <text x="315" y="118" text-anchor="middle" class="barLabel">55</text>
  <text x="805" y="126" text-anchor="middle" class="barLabel">54</text>

  <!-- Recall line: y = 620 - (recall - 0.790) / 0.040 * 525 -->
  <!-- Magnitude 0.814 -> 305.0, Filtered 0.818 -> 252.5 -->
  <line x1="315" y1="305.0" x2="805" y2="252.5" stroke="#ff6b00" stroke-width="2"/>
  <rect x="307" y="297.0" width="16" height="16" fill="#ff6b00" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="797" y="244.5" width="16" height="16" fill="#ff6b00" stroke="#ffffff" stroke-width="1.5"/>
  <text x="315" y="336" text-anchor="middle" class="lineValue">0.814</text>
  <text x="835" y="257" text-anchor="start" class="lineValue">0.818</text>

  <!-- Legend -->
  <rect x="785" y="94" width="175" height="80" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
  <rect x="810" y="113" width="28" height="18" fill="#0f6ed5"/>
  <text x="850" y="128" class="method">False Negative</text>
  <line x1="810" y1="153" x2="842" y2="153" stroke="#ff6b00" stroke-width="2"/>
  <rect x="824" y="147" width="12" height="12" fill="#ff6b00"/>
  <text x="850" y="159" class="method">Recall</text>

  <text x="315" y="655" text-anchor="middle" class="method">Magnitude warping</text>
  <text x="805" y="655" text-anchor="middle" class="method">Filtered MD</text>
  <text x="550" y="704" text-anchor="middle" class="label">Method</text>
</svg>
